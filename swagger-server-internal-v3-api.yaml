          description: The list of available groups.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserGroupSender'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/GeneralError'
  '/users/referenced-entities':
    get:
      summary: Find all referenced entities for users specified
      description: Find all referenced entities for users specified
      operationId: findReferencedEntitiesForUsers
      parameters:
        - name: userIds
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            items:
