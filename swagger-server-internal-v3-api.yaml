  /transfers/rewrap-symmetric-key:
    post:
      summary: Unwrap the symmetric key and wrap it for each recipient
      description: Unwrap the symmetric key with the system private key and wrap it with the public key of each recipient of a file.
      operationId: rewrapSymmetricKey
      requestBody:
        x-codegen-request-body-name: RewrapSymmetricKeyRequest
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RewrapSymmetricKeyRequest'
        required: true
      tags:
        - Transfers
      responses:
        '200':
          description: Symmetric key successfully rewrapped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RewrapSymmetricKeyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/GeneralError'
  /transfers/calculate-message-signature:
    post:
      summary: Calculate the message signature of a file being uploaded
      description: Calculate the message signature of a file being uploaded
      operationId: calculateMessageSignature
      requestBody:
        x-codegen-request-body-name: CalculateMessageSignatureRequest
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculateMessageSignatureRequest'
        required: true
      tags:
        - Transfers
      responses:
        '200':
          description: Message signature successfully calculated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculateMessageSignatureResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
