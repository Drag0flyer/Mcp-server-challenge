        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/GeneralError'
  '/communities/referenced-entities':
    get:
      summary: Find all referenced entities for communities specified
      description: Find all referenced entities for communities specified
      operationId: findReferencedEntitiesForCommunities
      parameters:
        - name: communityIds
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            items:
              type: integer
      tags:
        - Communities
      responses:
        '200':
          description: Referenced entities for communities were successfully retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Entity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/GeneralError'
  '/templates/referenced-entities':
    get:
      summary: Find all referenced entities for templates specified
      description: Find all referenced entities for templates specified
      operationId: findReferencedEntitiesForTemplates
      parameters:
        - name: templateIds
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            items:
              type: integer
      tags:
        - Templates
      responses:
        '200':
          description: Referenced entities for templates were successfully retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Entity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/GeneralError'
  /transfers/retrieve-encryption-context:
    post:
      summary: Retrieve the encryption context for a file
      description: Retrieve the symmetric key, the IV and the digest algorithm that are stored in a given PKCS7 file. The symmetric key is unwrapped using the recipient''s private key and then wrapped with the supplied public key.
      operationId: retrieveEncryptionContext
      requestBody:
        x-codegen-request-body-name: RetrieveEncryptionContextRequest
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetrieveEncryptionContextRequest'
        required: true
      tags:
        - Transfers
      responses:
        '200':
          description: Encryption context was successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveEncryptionContextResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/GeneralError'
  /transfers/store-signature-context-upload:
    post:
      summary: Store signature context in the database when uploading a file
      description: Store the signature context in the database when uploading a file
      operationId: storeSignatureContextUpload
      requestBody:
        x-codegen-request-body-name: StoreSignatureContextUploadRequest
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreSignatureContextUploadRequest'
        required: true
      tags:
        - Transfers
      responses:
        '200':
          description: Signature context was successfully saved
          content: { }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/GeneralError'
  /transfers/store-signature-context-download:
    post:
      summary: Store signature context in the database when downloading a file
      description: Store the signature context in the database when downloading a file
      operationId: storeSignatureContextDownload
      requestBody:
        x-codegen-request-body-name: StoreSignatureContextDownloadRequest
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreSignatureContextDownloadRequest'
        required: true
      tags:
        - Transfers
      responses:
        '200':
          description: Signature context was successfully saved
          content: { }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/GeneralError'
  /transfers/generate-default-anonymous-share-name:
    post:
      summary: Generate a default share name for an anonymous transfer in direct access token mode
      description: |
        Generate a default share name for an anonymous transfer in direct access token mode. The `operationType` selects the
        configured template: `SEND` uses the Quick Send template, `REQUEST` the Request File template.
      operationId: generateDefaultAnonymousShareName
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateDefaultAnonymousShareNameRequest'
      tags:
        - Transfers
      responses:
        '200':
          description: The anonymous share name was successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateDefaultAnonymousShareNameResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/GeneralError'
  /transfers/anonymous-share-name-availability:
    post:
      summary: Tell whether a share name is still free for an anonymous transfer
      description: |
        Answers whether the share name a caller intends to use for an anonymous transfer is still free, so a screen can mark
        the field before the transfer is submitted rather than reporting the collision afterwards.

        The name is tested exactly as `POST /http/anonymous-transfer` tests it: in the form the share actually carries,
        which is the name decorated with the owner discriminator - `<shareName> (<owner email>)`. The answer is therefore
        specific to the caller, and two users may hold the same base name at the same time since each one produces a
        different stored name. The name as given is deliberately not tested: it is never stored, so a collision on it would
        refuse a name whose stored form clashes with nothing.

        Both entities a transfer provisions are consulted - the share and the user group backing it, which carry the same
        decorated name. The group is created first, so a group holding that name refuses the transfer just as a share
        does.

        The answer is a snapshot, never a reservation: another caller can take the name in between, so the creation keeps
        applying the rule and stays the authority. A blank name is reported as available, the creation generating one.

        Sent as a POST with a body rather than as a query parameter because a share name accepts characters that would have
        to be escaped in a URL, which is also why the neighbouring share-name operations are POSTs.
      operationId: isAnonymousShareNameAvailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnonymousShareNameAvailabilityRequest'
      tags:
        - Transfers
      responses:
        '200':
          description: The availability of the share name was successfully determined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnonymousShareNameAvailabilityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/GeneralError'
  /transfers/retrieve-signature-context:
    post:
      summary: Retrieve signature context in the database
      description: Retrieve the signature context in the database for a given transfer
      operationId: retrieveSignatureContext
      requestBody:
        x-codegen-request-body-name: RetrieveSignatureContextRequest
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetrieveSignatureContextRequest'
        required: true
      tags:
        - Transfers
      responses:
        '200':
          description: Signature context was successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveSignatureContextResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/GeneralError'
  /transfers/finalize-download:
    post:
      summary: Finalize a download
      description: Finalize a download by validating the message signature (if using end-to-end encryption) and setting its final status in the database.
      operationId: finalizeDownload
      requestBody:
        x-codegen-request-body-name: FinalizeDownloadRequest
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinalizeDownloadRequest'
        required: true
      tags:
        - Transfers
      responses:
        '200':
          description: Download was successfully finalized
          content: { }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/GeneralError'
  /transfers/retrieve-system-public-key:
    post:
      summary: Retrieve the system public key
      description: Retrieve the system public key
      operationId: retrieveSystemPublicKey
      tags:
        - Transfers
      responses:
