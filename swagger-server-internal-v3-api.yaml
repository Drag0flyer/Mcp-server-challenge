  /configuration/bootstrap-configuration:
    post:
      summary: Bootstraps the configuration between the server and an instance of a Gateway or GUI
      description: The bootstrap of a Gateway or GUI requires the instance to send its public certificate that will be used to communicate with the server. If
        the certificate is valid, the server updates the configuration instance if needed (based on the version) and returns the crypto material (keys, certificates)
        required to configure this Gateway or GUI instance.
      operationId: bootstrapConfiguration
      requestBody:
        x-codegen-request-body-name: BootstrapConfigurationRequest
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapConfigurationRequest'
        required: true
      tags:
        - Configuration
      responses:
        '200':
          description: Bootstrap configuration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapConfigurationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/GeneralError'
      security: [ ]
  /configuration/add-untrusted-certificate:
    post:
      summary: Adds an unstrusted certificate
      description: When the Gateway or the GUI detects an untrusted certificate, they don't have access to the database to add it so they must call the server to do it.
