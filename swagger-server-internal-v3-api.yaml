      responses:
        '200':
          description: Manageable community ids were successfully retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/GeneralError'
  '/groups/referenced-entities':
    get:
      summary: Find all referenced entities for groups specified
      description: Find all referenced entities for groups specified
      operationId: findReferencedEntitiesForGroups
      parameters:
        - name: groupIds
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            items:
              type: integer
      tags:
        - Groups
      responses:
        '200':
          description: Referenced entities for groups were successfully retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Entity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
