      responses:
        '200':
          description: Referenced entities for users were successfully retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Entity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/GeneralError'
  '/users/{userId}/find-mfa-status':
    get:
      summary: Find the MFA status of the user.
      description: Find the MFA status of the user.
      operationId: findMfaStatus
      parameters:
        - name: userId
          description: The Id of the user.
          in: path
          required: true
          schema:
            type: integer
      tags:
        - Users
      responses:
        '200':
          description: The MFA status of the user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMfaStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/GeneralError'
  '/users/manageable-users':
    get:
      summary: Find the id of users that can be managed by the user performing this call
      description: Find the id of users amongst those specified in the userIds parameter (or all if not specified) that can be managed by the user performing this call
      operationId: findManageableUsers
      parameters:
