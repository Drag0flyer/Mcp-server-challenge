components:
  schemas:
    ShareOwner:
      description: The list of shares owned by a user
      type: object
      properties:
        userId:
          type: integer
          description: The id of the user who owns one or many shares.
        username:
          type: string
          description: The username of the user who owns one or many shares.
        ownedShares:
          type: array
          items:
            $ref: '#/components/schemas/OwnedShareInfo'
      required:
        - userId
        - username
        - ownedShares
    OwnedShareInfo:
      description: The information about a share owned by a user
      type: object
      properties:
        id:
          type: integer
          description: The share id.
        name:
          type: string
          description: The share name.
        lastActivityDate:
          type: string
          format: date-time
          description: The date at which the last activity occurred in this share.
        numberOfFiles:
          type: integer
          format: int64
          description: The number of files in the share.
      required:
        - id
        - name
        - lastActivityDate
        - numberOfFiles
    GroupInfo:
      description: The information about a group
      type: object
      properties:
        id:
          type: integer
          description: The group id.
        name:
          type: string
          description: The group name.
        description:
          type: string
          description: Description of the group.
      required:
        - id
        - name
        - description
    Entity:
      description: The list of referenced entities for a given entity
      properties:
        id:
          type: integer
          description: The entity id.
        name:
          type: string
          description: The entity name.
        referencedEntities:
          type: array
          items:
            $ref: '#/components/schemas/ReferencedEntity'
      required:
        - id
        - name
        - referencedEntities
    ReferencedEntity:
      description: The information about a referenced entity
      properties:
        name:
          type: string
          description: The entity name.
        type:
          type: string
          description: The entity type.
          enum:
            - TEMPLATE
            - SHARE
            - GROUP
      required:
        - name
        - type
    SwitchDomainMatchingUser:
      description: Describes a matching user in the system.
      type: object
      properties:
        id:
          type: integer
          description: User's Id in the system. It is generated at user creation time and read-only afterwards.
          example: 1
        userName:
          type: string
          description: User Id used to login to the application.
          example: userName1
        displayName:
          type: string
          description: 'The name of the user as commonly displayed. (ex: John Doe).'
          example: John Doe
        email:
          type: string
          description: 'The email address of the user. (ex: jdoe@example.com).'
          example: jdoe@example.com
        userRole:
          type: integer
          description: |
            Role:
             * 0 - ROLE_STANDARD: A standard user with the following rights:
                      Transfer files
                      Invite people to share (if enabled)
                      Manage their inbox
                      Delete files they have uploaded
             * 1 - ROLE_SYSTEM_ADMINISTRATOR: An administrator account can perform any action in the system except transfer files and receive files.
             * 2 - ROLE_SYSTEM_AUTOMATE: A special role indicating an automated process. This should NOT be used for user accounts.
             * 3 - ROLE_ANONYMOUS: A special role created to represent the rights of users which receive a link to download a file.They are not "true" users of the solution since there is no account created in their name.They only have the right to download the file which was sent to them.
             * 4 - ROLE_GUEST: A role identifying users that were invited to share files in the solution.They have a "true" account unlike anonymous users.They have the same rights as a RESTRICTED user but they cannot invite people to share.
             * 5 - ROLE_RESTRICTED: A role created to prepare the transition of standard users.Currently, this role has exactly the same rights as a standard users.
      required:
        - id
        - userName
        - displayName
        - email
        - userRole
    RetrieveEncryptionContextRequest:
      description: The request to retrieve the encryption context stored in a PKCS7 file
      type: object
      properties:
        transferUUID:
          type: string
          description: The UUID of the transfer for which to retrieve the encryption context.
          example: 12ef4f63-9ece-4197-afeb-4f5d81f80418
        wrappingPublicKey:
          type: string
          format: byte
          description: The public key used to wrap the symmetric key.
          example: 
        wrappingAlgorithm:
          $ref: '#/components/schemas/WrappingAlgorithmEnum'
      required:
        - transferUUID
        - wrappingPublicKey
        - wrappingAlgorithm
    RetrieveEncryptionContextResponse:
      description: The response when retrieving the encryption context stored in a PKCS7 file
      type: object
      properties:
        wrappedSymmetricKey:
          type: string
          format: byte
          description: The wrapped symmetric key.
          example: 
        encryptionMode:
          $ref: '#/components/schemas/EncryptionModeEnum'
        iv:
          type: string
          format: byte
          description: The IV.
          example: XGVtXOsRVRNf7gYbqKtKPQ==
        digestAlgorithm:
          $ref: '#/components/schemas/DigestAlgorithmEnum'
      required:
        - wrappedSymmetricKey
        - iv
        - digestAlgorithm
    StoreSignatureContextUploadRequest:
      type: object
      properties:
        uploadId:
          type: string
          description: The Transfer Id that uniquely identifies an upload file transfer.
          example: 94f07ba9-e12d-47f2-b1f7-032cdc354572
        signatureContext:
          $ref: '#/components/schemas/SignatureContext'
      description: The request to store the signature context of a PKCS7 file in the
        database for uploads.
    StoreSignatureContextDownloadRequest:
      description: The request to store the signature context of a PKCS7 file in the database for downloads.
      type: object
      properties:
        versionUUID:
          type: string
          description: The version Id that uniquely identifies a file version.
          example: 12ef4f63-9ece-4197-afeb-4f5d81f80418
        signatureContext:
          $ref: '#/components/schemas/SignatureContext'
      required:
        - versionUUID
        - signatureContext
    GenerateDefaultAnonymousShareNameRequest:
      description: Request to generate a default anonymous share name for direct access token mode
      type: object
      properties:
        operationType:
          type: string
          description: |
            Selects the share name template:
            - `REQUEST`: Request File template.
            - `SEND`: Quick Send template.
          enum:
            - REQUEST
            - SEND
          example: SEND
        emails:
          type: string
          description: This is a list of emails representing the recipients (separated by ;).
        language:
          type: string
          description: The language used to generate the name. If not specified, the user language will be used.
      required:
        - operationType
    GenerateDefaultAnonymousShareNameResponse:
      description: Response containing the generated share name for direct access token mode
      type: object
      properties:
        shareName:
          type: string
          description: The generated share name.
          example: Files sent from John to Jane on ...
      required:
        - shareName
    AnonymousShareNameAvailabilityRequest:
      description: Request asking whether a share name is still free for an anonymous transfer
      type: object
      properties:
        shareName:
          type: string
          description: The share name to test. A blank name is reported as available, the creation generating one.
          example: Files requested from Jane
      required:
        - shareName
    AnonymousShareNameAvailabilityResponse:
      description: Response telling whether the share name is still free
      type: object
      properties:
        available:
          type: boolean
          description: True when no existing share collides with either form of the name.
      required:
        - available
    RetrieveSignatureContextRequest:
      description: The request to retrieve the signature context of a PKCS7 file in the database
      type: object
      properties:
        transferUUID:
          type: string
          description: The UUID of the transfer for which the signature context must be retrieved.
          example: 12ef4f63-9ece-4197-afeb-4f5d81f80418
      required:
        - transferUUID
    RetrieveSignatureContextResponse:
      description: The response when retrieving the signature context of a PKCS7 file in the database
      type: object
      properties:
        signatureContext:
          $ref: '#/components/schemas/SignatureContext'
      required:
        - signatureContext
    SignatureContext:
      description: Contains information about the signature context of a PKCS7 file
      type: object
      properties:
        signerPublicKey:
          type: string
          format: byte
          description: The public key of the signer.
          example: 
        signedData:
          type: string
          format: byte
          description: The signed data, used to validate the signature.
          example: MV0wGAYJKoZIhvcNAQkDMQsGCSqGSIb3DQEHATAcBgkqhkiG9w0BCQUxDxcNMTkwMTMwMTg0ODQ2WjAjBgkqhkiG9w0BCQQxFgQUr6bIs6L66VeF3H2WhaV4NdcDrIg=
        signature:
          type: string
          format: byte
          description: The signature of the file.
          example: 
      required:
        - signerPublicKey
        - signedData
        - signature
    FinalizeDownloadRequest:
      description: The request to finalize a download
      type: object
      properties:
        transferUUID:
          type: string
          description: The UUID of the transfer for which the download must be finalized.
          example: 12ef4f63-9ece-4197-afeb-4f5d81f80418
        success:
          type: boolean
          description: Whether the download was a success or not.
          example: true
        message:
          type: string
          description: A message describing how the finalization process went.
          example: Signature is invalid
      required:
        - transferUUID
        - success
    RetrieveSystemPublicKeyResponse:
      description: The response when retrieving the system public key
      type: object
      properties:
        systemCertificateId:
          type: integer
          format: int64
          description: The id of the system certificate.
          example: 1
        systemPublicKey:
          type: string
          format: byte
          description: The system public key.
          example: 
      required:
        - systemCertificateId
        - systemPublicKey
    RewrapSymmetricKeyRequest:
      description: The request to rewrap the symmetric key
      type: object
      properties:
        systemCertificateId:
          type: integer
          format: int64
          description: The id of the system certificate.
          example: 1
        wrappedSymmetricKey:
          type: string
          format: byte
          description: The wrapped symmetric key.
          example: 
        wrappingAlgorithm:
          $ref: '#/components/schemas/WrappingAlgorithmEnum'
        recipientCertificateInfo:
          type: array
          description: The certificate informations about each recipient.
          items:
            $ref: '#/components/schemas/RecipientCertificateInfo'
      required:
        - systemCertificateId
        - wrappedSymmetricKey
        - wrappingAlgorithm
        - recipientCertificateInfo
    RecipientCertificateInfo:
      description: The certificate informations about a recipient
      type: object
      properties:
        issuerName:
          type: string
          description: The issuer name of the recipient certificate.
          example: CN=sfilersystem, OU=sfiler, DC=com
        serialNumber:
          type: string
          description: The serial number of the recipient certificate.
          example: "38003322371763250097514654634756848297395747115"
        publicKey:
          type: string
          format: byte
          description: The public key of the recipient.
          example: 
      required:
        - issuerName
        - serialNumber
        - publicKey
    RewrapSymmetricKeyResponse:
      description: The response when rewrapping the symmetric key
      type: object
      properties:
        recipientInfo:
          type: array
          description: The information about each recipient.
          items:
            $ref: '#/components/schemas/RecipientInfo'
      required:
        - recipientInfo
    RecipientInfo:
      description: The certificate informations about a recipient
      type: object
      properties:
        issuerName:
          type: string
          description: The issuer name of the recipient certificate.
          example: CN=sfilersystem, OU=sfiler, DC=com
        serialNumber:
          type: string
          description: The serial number of the recipient certificate.
          example: "38003322371763250097514654634756848297395747115"
        wrappedSymmetricKey:
          type: string
          format: byte
          description: The symmetric key wrapped with the public key of the recipient.
          example: 
      required:
        - issuerName
        - serialNumber
        - wrappedSymmetricKey
    CalculateMessageSignatureRequest:
      description: The request to calculate a message signature
      type: object
      properties:
        systemCertificateId:
          type: integer
          format: int64
          description: The id of the system certificate.
          example: 1
        signingTime:
          type: string
          format: date-time
          description: The signingTime attribute of the SignerInfo.
          example: 2019-02-13T11:42:51.7-05:00
        messageDigest:
          type: string
          format: byte
          description: The messageDigest attribute of the SignerInfo.
          example: r6bIs6L66VeF3H2WhaV4NdcDrIg=
        digestAlgorithm:
          $ref: '#/components/schemas/DigestAlgorithmEnum'
        wrappedSymmetricKey:
          type: string
          format: byte
          description: The wrapped symmetric key.
          example: 
        wrappingAlgorithm:
          $ref: '#/components/schemas/WrappingAlgorithmEnum'
        wrappingIv:
          type: string
          format: byte
          description: The IV used for wrapping.
          example: XGVtXOsRVRNf7gYbqKtKPQ==
      required:
        - systemCertificateId
        - signingTime
        - messageDigest
        - digestAlgorithm
        - wrappedSymmetricKey
        - wrappingAlgorithm
        - wrappingIv
    CalculateMessageSignatureResponse:
      description: The response when calculating a message signature
      type: object
      properties:
        messageSignature:
          type: string
          format: byte
          description: The message signature.
          example: 
      required:
        - messageSignature
    WrappingAlgorithmEnum:
      type: string
      enum:
        - RSA/ECB/OAEPwithSHA-256andMGF1Padding
      description: The wrapping algorithm
      example: RSA/ECB/OAEPwithSHA-256andMGF1Padding
    DigestAlgorithmEnum:
      type: string
      enum:
        - SHA-1
      description: The digest algorithm
      example: SHA-1
    EncryptionModeEnum:
      type: string
      enum:
        - CTR
        - CBC
      description: The encryption mode
      example: CTR
    ReportInfo:
      type: object
      discriminator:
        propertyName: reportType
      properties:
        reportType:
          type: string
        language:
          type: string
          example: en
        limitOfEntity:
          type: integer
          example: 5
        showSubEntities:
          type: boolean
          example: true
        outputType:
          type: string
          example: PDF
          enum:
            - PDF
            - CSV
        loggedUserId:
          type: integer
          example: 0
    UserReportInfo:
      allOf:
        - $ref: '#/components/schemas/ReportInfo'
        - type: object
          properties:
            sortType:
              type: string
              example: USERNAME
              enum:
                - USERNAME
                - LAST_ACCESS
                - DESCRIPTION
            filter:
              type: string
              example: ALL_USERS
              enum:
                - ALL_USERS
                - ALL_EXCEPT_ADMIN
                - ADMIN_ONLY
                - ORPHANS_ONLY
            userRoleType:
              type: string
              example: USER_ADMIN
              enum:
                - SYSTEM_ADMIN
                - USER_ADMIN
          required:
            - language
            - limitOfEntity
            - showSubEntities
            - sortType
            - filter
            - outputType
    GroupReportInfo:
      allOf:
        - $ref: '#/components/schemas/ReportInfo'
        - type: object
          properties:
            sortType:
              type: string
              example: NAME
              enum:
                - NAME
                - DESCRIPTION
            filter:
              type: string
              example: ALL_GROUPS
              enum:
                - ALL_GROUPS
                - EMPTY_USER
            userRoleType:
              type: string
              example: GROUP_ADMIN
              enum:
                - SYSTEM_ADMIN
                - GROUP_ADMIN
          required:
            - language
            - limitOfEntity
            - showSubEntities
            - sortType
            - filter
            - outputType
    CommunityReportInfo:
      allOf:
        - $ref: '#/components/schemas/ReportInfo'
        - type: object
          properties:
            sortType:
              type: string
              example: NAME
              enum:
                - NAME
                - DESCRIPTION
            filter:
              type: string
              example: ALL_COMMUNITIES
              enum:
                - ALL_COMMUNITIES
                - EMPTY_USER
                - EMPTY_TICKET
            userRoleType:
              type: string
              example: COMMUNITY_ADMIN
              enum:
                - SYSTEM_ADMIN
                - COMMUNITY_ADMIN
          required:
            - language
            - limitOfEntity
            - showSubEntities
            - sortType
            - filter
            - outputType
    KeyRenewalReportInfo:
      allOf:
        - $ref: '#/components/schemas/ReportInfo'
        - type: object
          properties:
            sortType:
              type: string
              example: CREATION_DATE
              enum:
                - CREATION_DATE
                - EXPIRATION_DATE
            filter:
              type: string
              example: ALL
              enum:
                - ALL
                - USER
                - COMMUNITY
                - SYSTEM
                - CA
          required:
            - sortType
            - filter
            - outputType
    FileReportInfo:
      allOf:
        - $ref: '#/components/schemas/ReportInfo'
        - type: object
          properties:
            sortType:
              maxLength: 20
              type: string
              enum:
                - FILENAME
                - DATE_ASC
                - DATE_DESC
                - FILE_SIZE_ASC
                - FILE_SIZE_DESC
            filter:
              type: string
              enum:
                - ALL
                - ALL_USERS
                - ALL_COMMUNITIES
                - SPECIFIC_USER
                - SPECIFIC_COMMUNITY
                - SPECIFIC_STORAGE
            elementId:
              type: integer
            grouping:
              type: string
              enum:
                - NONE
                - BY_RECIPIENT
                - SUMMARY_ONLY
                - BY_STORAGE
          required:
            - sortType
            - filter
            - grouping
            - outputType
    EventAuditReportInfo:
      allOf:
        - $ref: '#/components/schemas/ReportInfo'
        - type: object
          properties:
            systemEventAuditOIds:
              type: array
              items:
                type: string
            startDate:
              type: string
            endDate:
              type: string
            dateLang:
              type: string
          required:
            - systemEventAuditOIds
            - startDate
            - endDate
            - dateLang
            - outputType
    AuditReportInfo:
      allOf:
        - $ref: '#/components/schemas/ReportInfo'
        - type: object
          properties:
            username:
              type: string
            userUUID:
              type: string
            communityName:
              type: string
            communityUUID:
              type: string
            actions:
              type: array
              items:
                type: integer
            fileName:
              type: string
            startDate:
              type: string
            endDate:
              type: string
            searchInAllCommunities:
              type: boolean
            communities:
              type: array
              items:
                type: string
            includeAutomate:
              type: boolean
            auditReportType:
              type: string
              enum:
                - USER
                - COMMUNITY
                - ADMIN
            dateLang:
              type: string
          required:
            - actions
            - startDate
            - endDate
            - auditReportType
            - dateLang
            - outputType
    ReportId:
      type: object
      properties:
        reportId:
          type: string
      required:
        - reportId
    ReportStatus:
      type: object
      properties:
        status:
          type: string
          enum:
            - WAITING
            - PROCESSING
            - GENERATING
            - READY
            - FAILED
      required:
        - status
    DomainSwitchStatus:
      description: Describes the Domain Switch status.
      type: object
      properties:
        targetedUserName:
          type: string
          description: The targeted Username of the user performing the domain switch.
          example: userName2
        domainId:
          type: integer
          description: The domain id of the targeted domain switch.
          example: 1
        expirationDate:
          type: string
          format: date-time
          description: The domain switch expiration date.
        status:
          type: string
          enum:
            - NONE
            - IN_PROGRESS
            - EXPIRED
          description: |
            Status:
             * NONE: There is no ongoing domain switch.
             * IN_PROGRESS: There is currently a valid ongoing domain switch that is taking place.
             * EXPIRED: There is currently an ongoing domain switch but it is expired.
      required:
        - status
    UserGroupSender:
      description: Describes a group in the system.
      type: object
      properties:
        id:
          type: integer
          description: Group''s Id in the system. It is generated at group creation time and read-only afterwards.
        groupName:
          type: string
          description: Name of the group.
        groupSenderName:
          type: string
          description: When a group is allowed to be used as a sender, this property is use to set the sender name.
      required:
        - id
        - groupName
        - groupSenderName
    UserMfaStatus:
      description: Describes the MFA status of a user.
      type: object
      properties:
        enforced:
          type: boolean
          description: Flag indicating if the MFA is enforced.
        enabled:
          type: boolean
          description: Flag indicating if the MFA is enabled.
      required:
        - enforced
        - enabled
    NotificationTheme:
      description: The list of groups by a notification theme
      type: object
      properties:
        id:
          type: integer
          description: The id of the notification theme used by one or many groups.
        name:
          type: string
          description: The name of the notification theme used by one or many groups.
        groups:
          type: array
          items:
            $ref: '#/components/schemas/GroupInfo'
      required:
        - id
        - name
        - groups
    Theme:
      description: Describes a theme in the system
      type: object
      properties:
        id:
          type: integer
          description: The id of the theme.
        name:
          type: string
          description: The name of the theme.
        notificationThemeId:
          type: integer
          description: The id of the notification theme.
        guiTheme:
          type: string
          description: The GUI theme.
        defaultTheme:
          type: boolean
          description: The theme is the default.
        active:
          type: boolean
          description: The theme is active.
      required:
        - id
        - name
        - notificationThemeId
        - guiTheme
        - defaultTheme
        - active
    ResourceBundlePropertyOverride:
      description: Describes a resource bundle property override.
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: The Id of the resource bundle property override in the system. It is generated at creation time and read-only afterwards.
        bundleName:
          type: string
          description: The name of the resource bundle.
        language:
          type: string
          description: The language of the resource bundle property.
        key:
          type: string
          description: The key of the resource bundle property.
        value:
          type: string
          description: The value representing the overridden message for the specified resource bundle property.
      required:
        - id
        - bundleName
        - language
        - key
        - value
    FeatureFlag:
      type: object
      properties:
        name:
          type: string
          description: The feature flag name.
        active:
          type: boolean
          description: Indicates if the feature flag is active.
      required:
        - name
        - active
    Error:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        fields:
          type: string
    BootstrapConfigurationRequest:
      description: The request to bootstrap the configuration of a Gateway or GUI instance
      type: object
      properties:
        instanceName:
          type: string
          description: The instance name of the Gateway or GUI.
          example: Gateway1
        instanceVersion:
          type: string
          description: The version of the instance
          example: 4.13.0
        signature:
          type: string
          description: The signature to be used to validate the communication with the server.
          example: 
      required:
        - instanceName
        - instanceVersion
        - certificate
    BootstrapConfigurationResponse:
      type: object
      properties:
        keyStoreContent:
          type: string
          format: byte
          description: The keyStore content.
        keyStorePassword:
          type: string
          description: The encoded keyStore password.
          example: 09EB/A1+OnoU3hgEO+08wTIMroT8nPuYYUHYm/RxzwnMsJUf+3B456XdNGmQAiIa
      required:
        - keyStoreContent
        - keyStorePassword
    AddUntrustedCertificateRequest:
      type: object
      properties:
        instanceName:
          type: string
          description: The instance name of the Gateway or GUI.
          example: Gateway1
        alias:
          type: string
          description: The alias of the untrusted certificate.
          example: untrusted_cert_alias
        certificate:
          type: string
          format: byte
          description: The untrusted certificate content.
      required:
        - instanceName
        - alias
        - certificate
    ValidateNotificationThemeContentRequest:
      type: object
      properties:
        subject:
          type: string
          description: The subject of the notification (only used for email notifications).
          example: subjectContent
        body:
          type: string
          description: The notification body in base64.
          example: Ym9keUNvbnRlbnQ=
        includeInFramework:
          type: boolean
          description: When this flag is true, the returned body will be included in the framework. This flag is only relevant for email notifications and will be ignored for SMS notifications.
          example: true
          default: false
      required:
        - body
    ValidateNotificationThemeContentResponse:
      type: object
      description: The validation result of the notification theme content. The subjectValidationResult is not required since the subject is relevant only for email notifications.
      properties:
        subjectValidationResult:
          $ref: '#/components/schemas/NotificationThemeContentValidationResult'
        bodyValidationResult:
          $ref: '#/components/schemas/NotificationThemeContentValidationResult'
      required:
        - bodyValidationResult
    NotificationThemeContentValidationResult:
      properties:
        valid:
          type: boolean
          description: Indicates if the template content is valid.
        compiledContent:
          type: string
          description: The compiled content (returned only if the content compilation was successful).
        compilationError:
          type: string
          description: The compilation error (returned only if the content compilation was not successful).
        codeNearError:
          type: string
          description: The code near where the error has been found (returned only if the content compilation was not successful).
        line:
          type: integer
          description: The line where the error has been found (returned only if the content compilation was not successful).
        column:
          type: integer
          description: The column where the error has been found (returned only if the content compilation was not successful).
      required:
        - valid
    CountResult:
      type: object
      properties:
        count:
          type: integer
          format: int64
          example: 1
      required:
        - count
  responses:
    BadRequest:
      description: Bad request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: There is a conflict with an existing resource. This often happens when creating a new resource that already exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Not permitted to access this entity or perform this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    GeneralError:
      description: General Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Entity not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Not authorized to access this entity or perform this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RequestEntityTooLarge:
      description: Request is too large to process.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    AuthToken:
      type: apiKey
      description: The authentication token retrieved from a call to the login service
      name: authToken
      in: header
