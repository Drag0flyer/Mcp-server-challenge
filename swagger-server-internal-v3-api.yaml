openapi: 3.0.1
info:
  title: S-Filer server internal API
  description: |
    Base internal API for secure file transfer. This API is exposed by
    the server to anyone who would want to use it but since it is an internal API,
    there is no guarantee about the backward compatibility when a new version of S-Filer
    is released. This means the service behaviour is subject to change without notice.

    Every endpoint accepts an optional `X-REQUEST-ID` request header and every response carries one. It is the
    identifier the call is logged under, so quoting it lets support follow the call across components. A supplied
    value is kept only when it is at most 64 characters of letters, digits, `.`, `_` or `-`; anything else is
    rejected and replaced by a generated identifier. The response header always names the identifier actually used.
  version: v3
servers:
  - url: http://localhost/internal/api/v3
  - url: https://localhost/internal/api/v3
security:
  - AuthToken: [ ]
tags:
  - name: Authentication
    description: The Authentication internal endpoint.
  - name: Users
    description: The Users internal endpoint.
  - name: Groups
    description: The Groups internal endpoint.
  - name: Communities
    description: The Communities internal endpoint.
  - name: DirectAccessTokens
    description: The DirectAccessTokens internal endpoint.
  - name: Configuration
    description: The Configuration internal endpoint.
  - name: Reports
    description: The Reports internal endpoint.
  - name: Transfers
    description: The Transfers internal endpoint.
  - name: Templates
    description: The Templates internal endpoint.
  - name: Passwords
    description: The Passwords internal endpoint.
  - name: Themes
    description: The Themes internal endpoint.
  - name: NotificationThemes
    description: The NotificationThemes internal endpoint.
  - name: Policies
    description: The Password Policy internal endpoint.
paths:
  /auth/domains/find-base-url:
    get:
      summary: Retrieve the domain base URL
      description: Returns the base URL configuration parameter for the specified domain.
      operationId: findDomainBaseUrl
      parameters:
        - name: domainId
          description: The domain id.
          in: query
          schema:
            type: integer
      tags:
        - Authentication
      responses:
        200:
          description: The domain base URL was successfully returned.
          content:
            text/plain:
              schema:
                type: string
                description: The domain base URL
                example: https://sfiler.domain.com/sfiler
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/GeneralError'
  /users/shares/owners:
    get:
      summary: Find all shares owned by users specified
      description: Find all shares owned by users specified
      operationId: findOwnedSharesByUsers
      parameters:
        - name: userIds
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            items:
              type: integer
      tags:
        - Users
      responses:
        '200':
          description: Owned shares by users were successfully retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShareOwner'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/GeneralError'
  /users/match-identities:
    get:
      summary: Get the list of internal users matching the email of the authenticated user.
      description: Get the list of internal users matching the email of the authenticated user.
      operationId: matchIdentities
      tags:
        - Users
      responses:
        '200':
          description: The list of internal Users having the same email as the authenticated user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SwitchDomainMatchingUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/GeneralError'
  /users/{userId}/prepare-domain-switch:
    post:
      summary: Prepare an upcoming domain switch.
      description: Prepare an upcoming domain switch. This operation will then allow the system to propose a confirmation page after a successful login. The targeted user domain, and optionally its username, will be taken from the authenticated user.
      operationId: prepareUserDomainSwitch
      parameters:
        - name: userId
          description: The Id of the targeted user by the domain switch.
          in: path
          required: true
          schema:
            type: integer
      tags:
        - Users
      responses:
        '200':
          description: The domain switch preparation has been completed successfully.
          content: { }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/GeneralError'
  /users/domain-switch:
    post:
      summary: Execute the domain switch.
      description: Execute the domain switch. After the execution of this request, the authenticated user will be assigned to its new domain.
      operationId: executeUserDomainSwitch
      tags:
        - Users
      responses:
        '200':
          description: The domain switch has been executed successfully.
          content: { }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/GeneralError'
  /users/abort-domain-switch:
    post:
      summary: Abort the domain switch.
      description: Abort the domain switch. This operation aborts the domain switch for the authenticated user.
      operationId: abortUserDomainSwitch
      tags:
        - Users
      responses:
        '200':
          description: The domain switch has been aborted successfully.
          content: { }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/GeneralError'
  /users/find-domain-switch-status:
    post:
      summary: Post a request that gives the status of a possible ongoing domain switch.
      description: Post a request that gives the status of a possible ongoing domain switch for a specific user.
      operationId: findDomainSwitchStatus
      tags:
        - Users
      responses:
        '200':
          description: The domain switch status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainSwitchStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/GeneralError'
  /users/retrieve-sender-groups:
    get:
      summary: Get available groups that the authenticated user can use to send file
      description: Get available groups that the authenticated user can use for send file.
      operationId: getGroupsAllowedForSendFile
      tags:
        - Users
      responses:
